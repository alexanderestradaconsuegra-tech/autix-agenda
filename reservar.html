<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar cita · AgendaOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0b1220;
--card:#111b2e;
--line:rgba(255,255,255,.08);
--text:#f5f7fb;
--muted:#9aa8bc;
--blue:#5b7cff;
--cyan:#24d7c7;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,sans-serif;
background:
radial-gradient(circle at top left, rgba(91,124,255,.25), transparent 30%),
linear-gradient(180deg,#08111f,#0c1728);
color:var(--text);
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
}
.wrap{
width:min(100%,780px);
}
.hero{
margin-bottom:18px;
text-align:center;
}
.hero h1{
margin:0;
font-size:42px;
letter-spacing:-.06em;
}
.hero p{
color:var(--muted);
margin-top:10px;
}
.card{
background:rgba(17,27,46,.92);
border:1px solid var(--line);
border-radius:28px;
padding:24px;
backdrop-filter:blur(18px);
box-shadow:0 24px 80px rgba(0,0,0,.35);
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}
.fg{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:14px;
}
label{
font-size:12px;
text-transform:uppercase;
letter-spacing:.08em;
font-weight:800;
color:var(--muted);
}
input,select{
height:52px;
border-radius:16px;
border:1px solid var(--line);
background:#0d1729;
color:white;
padding:0 14px;
font-size:14px;
outline:none;
}
button{
height:56px;
border:0;
border-radius:18px;
font-weight:800;
font-size:15px;
cursor:pointer;
background:linear-gradient(135deg,var(--blue),var(--cyan));
color:white;
width:100%;
margin-top:8px;
box-shadow:0 18px 40px rgba(91,124,255,.28);
}
.slots{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:10px;
margin-top:10px;
}
.slot{
height:44px;
border-radius:14px;
border:1px solid var(--line);
display:grid;
place-items:center;
font-weight:700;
cursor:pointer;
background:#0d1729;
transition:.2s;
}
.slot:hover,.slot.active{
background:linear-gradient(135deg,var(--blue),var(--cyan));
border-color:transparent;
}
.ok{
display:none;
margin-top:16px;
padding:14px;
border-radius:16px;
background:rgba(36,215,199,.12);
border:1px solid rgba(36,215,199,.22);
}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.hero h1{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>Reserva tu cita</h1>
<p>Selecciona servicio, horario y confirma tu reserva online.</p>
</div>

<div class="card">
<div class="grid">
<div class="fg">
<label>Nombre</label>
<input id="name" placeholder="Tu nombre">
</div>

<div class="fg">
<label>WhatsApp</label>
<input id="phone" placeholder="+56 9...">
</div>

<div class="fg">
<label>Servicio</label>
<select id="service">
<option value="servicio_1">Servicio principal</option>
<option value="servicio_2">Servicio especializado</option>
<option value="servicio_3">Servicio premium</option>
</select>
</div>

<div class="fg">
<label>Profesional</label>
<select id="professional">
<option value="pro_1">Disponible</option>
<option value="pro_2">Profesional 2</option>
<option value="pro_3">Profesional 3</option>
</select>
</div>

<div class="fg">
<label>Fecha</label>
<input type="date" id="date">
</div>

<div class="fg">
<label>Horario disponible</label>
<div class="slots" id="slots"></div>
</div>
</div>

<button id="reserveBtn">Confirmar reserva</button>

<div class="ok" id="okBox">
Reserva enviada correctamente. Recibirás confirmación por WhatsApp.
</div>
</div>
</div>

<script>
const N8N = 'https://n8n-n8n.fa2cjf.easypanel.host/webhook';
const API_KEY = 'AUTIX-2025-xK9mP3qR8nL7';

const slots = [
'09:00','09:30','10:00','10:30',
'11:00','11:30','12:00','12:30',
'15:00','15:30','16:00','16:30'
];

let selectedSlot = null;

const slotsWrap = document.getElementById('slots');

slots.forEach(hour=>{
  const div = document.createElement('div');
  div.className = 'slot';
  div.textContent = hour;

  div.onclick = ()=>{
    document.querySelectorAll('.slot').forEach(s=>s.classList.remove('active'));
    div.classList.add('active');
    selectedSlot = hour;
  };

  slotsWrap.appendChild(div);
});

document.getElementById('reserveBtn').onclick = async ()=>{

  const payload = {
    org_id: new URLSearchParams(location.search).get('negocio') || 'demo',
    nombre: document.getElementById('name').value,
    telefono: document.getElementById('phone').value,
    servicio_id: document.getElementById('service').value,
    profesional_id: document.getElementById('professional').value,
    fecha: document.getElementById('date').value,
    hora: selectedSlot,
    origen: 'pagina_web'
  };

  if(!payload.nombre || !payload.telefono || !payload.fecha || !payload.hora){
    alert('Completa todos los campos');
    return;
  }

  try{

    const r = await fetch(`${N8N}/agenda-public-booking`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':API_KEY
      },
      body:JSON.stringify(payload)
    });

    if(!r.ok){
      throw new Error('Error al reservar');
    }

    document.getElementById('okBox').style.display='block';

  }catch(err){
    console.error(err);
    alert('No fue posible completar la reserva');
  }

};
</script>
</body>
</html>
